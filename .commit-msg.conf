# Commit-message rules. Committed, because behaviour that depends on a
# per-developer setting is not a standard (constitution, Principle V).
#
# Sourced by scripts/hooks/commit-msg.sh with `.`, so this is POSIX sh
# assignments and nothing else -- no JSON, no YAML, no parser the check would
# then depend on (Principle I). Contract:
# specs/008-commit-hooks/contracts/commit-msg-conf.md
#
# Editing this file changes the rules for every contributor at their next
# commit. No code change, no reinstall, no `npm install`. That is what
# Principle V's "documented path" buys.

# Permitted commit types, space-separated. The Angular set.
#
# Conventional Commits v1.0.0 mandates only `feat` and `fix` and leaves the rest
# of the vocabulary open; this repository's history already uses the Angular
# eleven. Widening this list is backward-compatible. Narrowing it refuses
# messages that were previously acceptable, so propose that rather than merging
# it quietly.
COMMIT_MSG_TYPES='build chore ci docs feat fix perf refactor revert style test'

# Scope policy: required | optional | forbidden
#
# `optional`, on the evidence of the history this rule now governs: `feat:
# distribute five authored skills with the plugin` carries no scope and
# `refactor(skills): rename the five plugin skills to a ccd- prefix` carries
# one. `required` would retroactively invalidate the first, `forbidden` the
# second.
COMMIT_MSG_SCOPE_POLICY='optional'

# Maximum length of the FIRST line, in characters. Later lines are not
# length-checked at all: this repository's own commit trailers carry URLs, and a
# whole-message or per-line rule would make its existing convention illegal.
COMMIT_MSG_MAX_SUBJECT='72'
