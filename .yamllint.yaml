# Pure yamllint "default" ruleset — no relaxations beyond the
# line-length override this repo explicitly wants. Add more rule
# overrides here only when a real generated/vendored YAML file forces
# the issue.
extends: default

rules:
  line-length:
    max: 160

# gitignore-style patterns — excludes generated/vendored trees (npm, uv).
ignore: |
  node_modules/
  .venv/
