# Hook execution order for this repository. Committed configuration, per FR-025.
#
# THE PRINCIPLE (FR-025a). Lower `priority` runs first; `get_hooks_for_event()`
# sorts ascending with a stable tie-break on insertion order. The ranks below are
# assigned by effect, so that the order can be derived rather than guessed:
#
#     hooks that only OBSERVE run before hooks that MODIFY the repository,
#     and the hook that COMMITS runs last of all, because it must capture
#     whatever every earlier hook wrote.
#
#     10  superb         evidence-first trust gates. Observational, and a gate
#                        that runs after the thing it gates is not a gate.
#     20  token-budget   reports usage and compacts artifacts in place. Reads
#                        before the mutating hooks; its compaction must precede
#                        any commit.
#     30  agent-context  rewrites the agent instruction file at after_specify
#                        and after_plan. First genuinely mutating hook.
#     40  assess, bug    write their own artifacts under .specify/, and only on
#                        their own commands.
#     50  git            commits. Last unconditionally.
#
# Gaps of ten leave room to place a later extension without renumbering it.
#
# WARNING, and it matters. `ExtensionManager.register_hooks()` purges an
# extension's entries for each event and re-adds them from its own manifest on
# every install, reinstall, update and --force. No extension in this set ships a
# hook priority, so every one of those operations returns its hooks to the
# default of 10 -- where they all tie, and the tie-break is install order, which
# is the discovery-order dependence FR-025 exists to forbid. The same rewrite
# also erases this comment block, because the config is written with
# yaml.safe_dump. After any `specify extension add` or `specify extension
# update`, re-apply these ranks and restore this header. The durable copy of the
# reasoning is specs/001-quality-gate-plugin/research.md section 18.
#
# `specify extension set-priority` does NOT set this. It sets the extension's
# RESOLUTION priority -- which extension wins when two provide the same template
# or command. Running it and expecting the hooks to reorder produces no change
# and no error.
installed:
  - agent-context
  - assess
  - bug
  - git
  - superb
  - token-budget
settings:
  auto_execute_hooks: true
hooks:
  after_specify:
    - extension: superb
      command: speckit.superb.brainstorm
      enabled: true
      optional: true
      priority: 10
      prompt: Refine the new spec.md with Superpowers brainstorming before clarification
        or planning?
      description: 'Optional spec refinement gate. Uses an installed superpowers brainstorming
        skill to strengthen the active Spec Kit spec.md while preserving Spec Kit ownership
        of specification creation.

        '
      condition: null
    - extension: token-budget
      command: speckit.token-budget.compact
      enabled: true
      optional: true
      priority: 20
      prompt: Compact spec.md to reduce tokens for /speckit.plan?
      description: Compact spec after specification
      condition: null
    - extension: agent-context
      command: speckit.agent-context.update
      enabled: true
      optional: true
      priority: 30
      prompt: Execute speckit.agent-context.update?
      description: Refresh agent context after specification
      condition: null
    - extension: git
      command: speckit.git.commit
      enabled: true
      optional: true
      priority: 50
      prompt: Commit specification changes?
      description: Auto-commit after specification
      condition: null
  after_plan:
    - extension: token-budget
      command: speckit.token-budget.compact
      enabled: true
      optional: true
      priority: 20
      prompt: Compact plan and design docs to reduce tokens for /speckit.tasks?
      description: Compact plan docs after planning
      condition: null
    - extension: agent-context
      command: speckit.agent-context.update
      enabled: true
      optional: true
      priority: 30
      prompt: Execute speckit.agent-context.update?
      description: Refresh agent context after planning
      condition: null
    - extension: git
      command: speckit.git.commit
      enabled: true
      optional: true
      priority: 50
      prompt: Commit plan changes?
      description: Auto-commit after implementation planning
      condition: null
  before_constitution:
    - extension: git
      command: speckit.git.initialize
      enabled: true
      optional: false
      priority: 50
      prompt: Execute speckit.git.initialize?
      description: Initialize Git repository before constitution setup
      condition: null
  before_specify:
    - extension: git
      command: speckit.git.feature
      enabled: true
      optional: false
      priority: 50
      prompt: Execute speckit.git.feature?
      description: Create feature branch before specification
      condition: null
  before_clarify:
    - extension: git
      command: speckit.git.commit
      enabled: true
      optional: true
      priority: 50
      prompt: Commit outstanding changes before clarification?
      description: Auto-commit before spec clarification
      condition: null
  before_plan:
    - extension: token-budget
      command: speckit.token-budget.scope
      enabled: true
      optional: true
      priority: 20
      prompt: Scope a focused reading manifest for /speckit.plan?
      description: Scope reading manifest before planning
      condition: null
    - extension: git
      command: speckit.git.commit
      enabled: true
      optional: true
      priority: 50
      prompt: Commit outstanding changes before planning?
      description: Auto-commit before implementation planning
      condition: null
  before_tasks:
    - extension: token-budget
      command: speckit.token-budget.scope
      enabled: true
      optional: true
      priority: 20
      prompt: Scope a focused reading manifest for /speckit.tasks?
      description: Scope reading manifest before task generation
      condition: null
    - extension: git
      command: speckit.git.commit
      enabled: true
      optional: true
      priority: 50
      prompt: Commit outstanding changes before task generation?
      description: Auto-commit before task generation
      condition: null
  before_implement:
    - extension: superb
      command: speckit.superb.implementation-gate
      enabled: true
      optional: false
      priority: 10
      prompt: Execute speckit.superb.implementation-gate?
      description: 'Mandatory readiness gate. Reports test-first constraints without
        executing tasks or taking ownership from speckit.implement.

        '
      condition: null
    - extension: token-budget
      command: speckit.token-budget.scope
      enabled: true
      optional: true
      priority: 20
      prompt: Scope a focused reading manifest for /speckit.implement?
      description: Scope reading manifest before implementation
      condition: null
    - extension: git
      command: speckit.git.commit
      enabled: true
      optional: true
      priority: 50
      prompt: Commit outstanding changes before implementation?
      description: Auto-commit before implementation
      condition: null
  before_checklist:
    - extension: git
      command: speckit.git.commit
      enabled: true
      optional: true
      priority: 50
      prompt: Commit outstanding changes before checklist?
      description: Auto-commit before checklist generation
      condition: null
  before_analyze:
    - extension: git
      command: speckit.git.commit
      enabled: true
      optional: true
      priority: 50
      prompt: Commit outstanding changes before analysis?
      description: Auto-commit before analysis
      condition: null
  before_taskstoissues:
    - extension: git
      command: speckit.git.commit
      enabled: true
      optional: true
      priority: 50
      prompt: Commit outstanding changes before issue sync?
      description: Auto-commit before tasks-to-issues conversion
      condition: null
  after_constitution:
    - extension: git
      command: speckit.git.commit
      enabled: true
      optional: true
      priority: 50
      prompt: Commit constitution changes?
      description: Auto-commit after constitution update
      condition: null
  after_clarify:
    - extension: git
      command: speckit.git.commit
      enabled: true
      optional: true
      priority: 50
      prompt: Commit clarification changes?
      description: Auto-commit after spec clarification
      condition: null
  after_tasks:
    - extension: token-budget
      command: speckit.token-budget.compact
      enabled: true
      optional: true
      priority: 20
      prompt: Compact tasks.md to reduce tokens for /speckit.implement?
      description: Compact tasks after task generation
      condition: null
    - extension: git
      command: speckit.git.commit
      enabled: true
      optional: true
      priority: 50
      prompt: Commit task changes?
      description: Auto-commit after task generation
      condition: null
  after_implement:
    - extension: git
      command: speckit.git.commit
      enabled: true
      optional: true
      priority: 50
      prompt: Commit implementation changes?
      description: Auto-commit after implementation
      condition: null
  after_checklist:
    - extension: git
      command: speckit.git.commit
      enabled: true
      optional: true
      priority: 50
      prompt: Commit checklist changes?
      description: Auto-commit after checklist generation
      condition: null
  after_analyze:
    - extension: git
      command: speckit.git.commit
      enabled: true
      optional: true
      priority: 50
      prompt: Commit analysis results?
      description: Auto-commit after analysis
      condition: null
  after_taskstoissues:
    - extension: git
      command: speckit.git.commit
      enabled: true
      optional: true
      priority: 50
      prompt: Commit after syncing issues?
      description: Auto-commit after tasks-to-issues conversion
      condition: null
